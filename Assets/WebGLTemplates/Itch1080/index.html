<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* The game always renders at 1920x1080; the canvas is scaled to fit the page at 16:9 (letterboxed). */
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; outline: none; display: block; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
                 color: #f2e4c4; font: 600 22px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.04em; pointer-events: none; }
      #bar { width: min(420px, 60vw); height: 10px; border-radius: 5px; background: rgba(255,255,255,0.15); overflow: hidden; }
      #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #e8a33a, #f5d36b); transition: width 0.2s; }
      #percent { font-size: 15px; font-weight: 500; opacity: 0.8; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <div id="loading">
      <div>{{{ PRODUCT_NAME }}}</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="percent">Loading 0%</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var GAME_W = 1920, GAME_H = 1080;
      var canvas = document.querySelector("#unity-canvas");

      // Fit the 16:9 canvas inside the page (or the fullscreen window), keeping the aspect ratio
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var scale = Math.min(w / GAME_W, h / GAME_H);
        canvas.style.width = Math.floor(GAME_W * scale) + "px";
        canvas.style.height = Math.floor(GAME_H * scale) + "px";
      }
      window.addEventListener("resize", fit);
      document.addEventListener("fullscreenchange", fit);
      fit();

      // Clicking the game gives it keyboard focus (needed inside the itch.io iframe)
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Render at exactly 1920x1080 whatever the size the canvas is shown at
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
      }, function (progress) {
        var p = Math.round(progress * 100);
        document.getElementById("fill").style.width = p + "%";
        document.getElementById("percent").textContent = "Loading " + p + "%";
      }).then(function (unityInstance) {
        document.getElementById("loading").style.display = "none";
        canvas.width = GAME_W;
        canvas.height = GAME_H;
        fit();
        canvas.focus();
      }).catch(function (message) {
        document.getElementById("percent").textContent = message;
      });
    </script>
  </body>
</html>
